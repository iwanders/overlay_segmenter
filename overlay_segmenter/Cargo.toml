[package]
name = "overlay_segmenter"
version = "0.1.0"
edition = "2024"

# Single source of truth; https://users.rust-lang.org/t/how-to-specify-a-dev-dependency-with-the-same-version-as-the-matching-dependency/89934/4
[workspace.dependencies]
flash_powder = { git = "https://github.com/iwanders/flash_powder.git", version = "0.1.0", features = ["cuda" ] }
flash_powder_safetensors = { git = "https://github.com/iwanders/flash_powder.git", version = "0.1.0" }
flash_powder_image = { git = "https://github.com/iwanders/flash_powder.git", version = "0.1.0" }
#flash_powder = { path="../../../torch_stable_rs/repo/flash_powder", features = ["cuda", "v2_13"] }
#flash_powder_safetensors = { path="../../../torch_stable_rs/repo/flash_powder_safetensors" }

[dependencies]

anyhow = "1.0.102"

image = {version="0.25.10", features=["jpeg"]}
flash_powder = {workspace=true}
flash_powder_safetensors = {workspace=true}
flash_powder_image = {workspace=true}

serde={version="1", features=["derive"]}
serde_json={version="1" }
serde_bytes = {version="0.11"}
postcard = {version="1", features=["use-std", "alloc"]}

[build-dependencies]
flash_powder = {workspace=true}

[dev-dependencies]
clap = { version = "4.6.2", features = ["derive"] }
screen_capture = { git = "https://github.com/iwanders/screen_capture", rev = "6a081da10def86a09e27adf9f21aa505783362ed" }

[profile.release]
debug = true
